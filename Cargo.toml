[package]
name = "floatdo_native"
version = "0.1.0"
edition = "2021"
description = "FloatDo 纯 Win32 原生版 —— 内存占用极小的悬浮球待办工具"

[[bin]]
name = "floatdo_native"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
opt-level = "z"        # 最小体积
lto = true
codegen-units = 1
strip = true
panic = "abort"
