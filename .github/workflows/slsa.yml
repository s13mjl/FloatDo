name: SLSA generic generator

on:
  release:
    types: [published]

permissions: read-all

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
    - uses: actions/checkout@v4

    - name: Build artifacts
      run: cargo build --release --verbose

    - name: Upload binary to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ github.event.release.tag_name }}" target/release/floatdo_native.exe --clobber

    - name: Generate subject for provenance
      id: hash
      shell: pwsh
      run: |
        $file = "target/release/floatdo_native.exe"
        $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
        $subject = "$hash  floatdo_native.exe"
        $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($subject))
        "digests=$b64" >> $env:GITHUB_OUTPUT

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
